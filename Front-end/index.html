<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Text Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8 space-y-6">
    <h1 class="text-3xl font-bold text-blue-700">AI Text Detector</h1>

    <textarea id="inputText" rows="10" placeholder="Paste your text here..." class="w-full p-4 border border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"></textarea>

    <div class="flex items-center justify-between flex-col sm:flex-row gap-4">
      <select id="modelSelector" class="w-full sm:w-1/3 p-3 border border-blue-300 rounded-lg text-blue-700 bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="nb">Naive Bayes</option>
        <option value="dnn">Deep Neural Network</option>
        <option value="rf">Random Forest</option>
      </select>

      <button id="detectBtn" class="w-full sm:w-1/3 p-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition duration-200">Detect AI</button>
    </div>

    <div id="result" class="text-blue-700 font-medium"></div>

    <div id="report" class="hidden mt-6 bg-blue-100 p-4 rounded-lg space-y-4">
      <div class="text-xl font-semibold text-blue-800">Detection Report</div>
      <div><strong>AI Probability:</strong> <span id="aiPercentage" class="text-blue-700">-</span></div>
      <div class="bg-white p-4 rounded-lg border border-blue-300">
        <div class="text-sm text-gray-700 mb-2">Highlighted AI-generated segments:</div>
        <div id="highlightedText" class="whitespace-pre-wrap"></div>
      </div>
    </div>
  </div>

  <script>
  document.getElementById('detectBtn').addEventListener('click', () => {
    const text = document.getElementById('inputText').value.trim();
    const model = document.getElementById('modelSelector').value;

    if (!text) {
      alert("Please enter some text to analyze.");
      return;
    }

    // Fake AI probability percentage
    const aiProbability = Math.floor(Math.random() * 100) + 1;
    document.getElementById('aiPercentage').innerText = aiProbability + '%';

    // Improved word highlighting: highlight every 5th word (ignoring whitespace tokens)
    const rawWords = text.split(/(\\s+)/); // Keeps whitespace for formatting
    let realWordIndex = 0;

    const highlighted = rawWords.map((token) => {
      if (token.trim().length === 0) return token; // Whitespace

      realWordIndex++;
      if (realWordIndex % 5 === 0) {
        return `<span class=\"bg-yellow-300 px-1 rounded\">${token}</span>`;
      }
      return token;
    }).join('');

    // Show results
    document.getElementById('highlightedText').innerHTML = highlighted;
    document.getElementById('report').classList.remove('hidden');
    document.getElementById('result').innerText = `Analyzed using model \"${model.toUpperCase()}\"`;
  });
</script>
</body>
</html>
